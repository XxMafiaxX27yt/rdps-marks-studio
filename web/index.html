<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDPS Marks Studio</title>
<meta name="description" content="Rukmini Devi Public School - marks analysis and Excel reports. Everything runs on this computer; marks are never uploaded.">
<!-- Privacy lock: this page may only talk to itself and (for the optional on-device AI models) Hugging Face.
     Student data has nowhere else to go. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' blob: data: https://huggingface.co https://*.huggingface.co https://*.hf.co https://cdn-lfs.hf.co https://cas-bridge.xethub.hf.co; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#0B3C5D">
<link rel="icon" href="assets/img/icon-64.png">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-badge"><img src="assets/img/rdps-logo.png" alt=""></div>
    <div class="splash-school">Rukmini Devi Public School</div>
    <div class="splash-title">Marks <span>Studio</span></div>
    <div class="splash-bar"><i id="splash-progress"></i></div>
    <div class="splash-note" id="splash-note">Getting ready…</div>
  </div>
  <div class="splash-orbs"><i></i><i></i><i></i></div>
</div>

<header class="topbar">
  <a class="brand" href="#/school" aria-label="RDPS Marks Studio home">
    <span class="brand-badge"><img src="assets/img/rdps-logo.png" alt="RDPS logo"></span>
    <span class="brand-text"><b>RDPS</b> Marks Studio</span>
  </a>
  <nav class="nav" id="nav">
    <a href="#/school" data-route="school"><svg viewBox="0 0 24 24"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg>School results</a>
    <a href="#/board" data-route="board"><svg viewBox="0 0 24 24"><path d="M12 3l9 4-9 4-9-4 9-4zm-6 6v5c0 2 3 4 6 4s6-2 6-4V9"/></svg>Board results</a>
    <a href="#/ask" data-route="ask"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4V5z"/></svg>Ask</a>
    <a href="#/teachers" data-route="teachers"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3 3 0 0 1 0 5.6M18 14c2 .6 3 2.6 3 6"/></svg>Teachers</a>
    <a href="#/template" data-route="template"><svg viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6zM14 3v6h6"/></svg>Template</a>
    <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>Settings</a>
    <a href="#/help" data-route="help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14m0 3h.01"/></svg>How it works</a>
  </nav>
  <div class="top-actions">
    <span class="engine-chip" id="engine-chip" title="The tool's engine runs inside this browser"><i></i><span>Starting…</span></span>
    <button class="icon-btn" id="btn-present" title="Presentation mode (bigger text, pointer highlight, guided tour)" aria-label="Presentation mode">
      <svg viewBox="0 0 24 24"><path d="M3 4h18v12H3zM8 20h8M12 16v4"/></svg></button>
    <button class="icon-btn" id="btn-theme" title="Light / dark" aria-label="Switch light or dark mode">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
    <button class="icon-btn menu-btn" id="btn-menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="foot">
  <span>🔒 Marks are processed on this computer only - nothing is uploaded.</span>
  <span id="foot-version"></span>
</footer>

<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="print-root"></div>
<div id="pointer-halo"></div>

<script src="vendor/chartjs/chart.umd.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
